<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640">
  <rect width="920" height="640" fill="#f6f3ee"/>
  <text x="36" y="42" font-family="Georgia, serif" font-size="28" fill="#1c1917">Udyam Digital — local prototype</text>
  <text x="36" y="68" font-family="sans-serif" font-size="13" fill="#57534e">Synthetic demo. No payment, government API, or public deployment.</text>
  <g font-family="sans-serif" font-size="13" fill="#1c1917">
    <rect x="36" y="96" width="200" height="72" rx="12" fill="#fff" stroke="#1c1917"/>
    <text x="48" y="126">Browser</text>
    <text x="48" y="146" fill="#57534e">English or Hindi UI</text>
    <rect x="280" y="96" width="250" height="88" rx="12" fill="#fff" stroke="#1c1917"/>
    <text x="292" y="126">Next.js :43123</text>
    <text x="292" y="146" fill="#57534e">Consent, quote, KYC, PDF</text>
    <text x="292" y="164" fill="#57534e">Owner cookie or desk key</text>
    <rect x="574" y="96" width="310" height="88" rx="12" fill="#fff" stroke="#1c1917"/>
    <text x="586" y="126">Catalogue rules</text>
    <text x="586" y="146" fill="#57534e">Floors, dependencies, eligibility</text>
    <text x="586" y="164" fill="#57534e">Case clock 15 July 2026</text>
    <rect x="36" y="230" width="250" height="88" rx="12" fill="#fff" stroke="#1c1917"/>
    <text x="48" y="260">Python ranker :43124</text>
    <text x="48" y="280" fill="#57534e">Scores eligible products only</text>
    <rect x="330" y="230" width="250" height="88" rx="12" fill="#fff" stroke="#1c1917"/>
    <text x="342" y="260">Tesseract OCR</text>
    <text x="342" y="280" fill="#57534e">Then checksum and mock CSV</text>
    <rect x="624" y="230" width="260" height="88" rx="12" fill="#fff" stroke="#1c1917"/>
    <text x="636" y="260">llama.cpp :43125</text>
    <text x="636" y="280" fill="#57534e">Paraphrase only. Claim checks</text>
    <text x="636" y="298" fill="#57534e">or labelled fallback</text>
    <rect x="180" y="370" width="560" height="88" rx="12" fill="#fff" stroke="#1c1917"/>
    <text x="192" y="400">Plaintext JSON store</text>
    <text x="192" y="420" fill="#57534e">Sessions and orders. 14-day purge on the next read. Not encrypted.</text>
    <rect x="180" y="490" width="560" height="88" rx="12" fill="#fff" stroke="#1c1917"/>
    <text x="192" y="520">Partner handoff</text>
    <text x="192" y="540" fill="#57534e">Long bearer code. Masked GSTIN and Udyam. No contact name or OCR.</text>
  </g>
  <path d="M236 132 H280" stroke="#1c1917" fill="none"/>
  <path d="M530 140 H574" stroke="#1c1917" fill="none"/>
  <path d="M405 184 V230" stroke="#1c1917" fill="none"/>
  <path d="M160 184 V230" stroke="#1c1917" fill="none"/>
  <path d="M754 184 V230" stroke="#1c1917" fill="none"/>
  <path d="M460 318 V370" stroke="#1c1917" fill="none"/>
  <path d="M460 458 V490" stroke="#1c1917" fill="none"/>
</svg>
